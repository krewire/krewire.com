# Edge routing for cloud.krewire.com
# Canonical source: krewire.com/landings/nginx/cloud.krewire.com.conf
# Install: sudo install -m 0644 <this file> /etc/nginx/sites-available/cloud.krewire.com
#          sudo nginx -t && sudo systemctl reload nginx
#
# Layout:
#   /          -> static landing page container (krewire-landing-cloud, 127.0.0.1:8095)
#   /*         -> Cloud control plane (/console, /login, /api, /healthz)
server {
    server_name cloud.krewire.com;

    # ── Product landing page ─────────────────────────────────────────────────
    location = / {
        limit_req zone=general_limit burst=100 nodelay;
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        # Edge (conf.d/security.conf) already sets these globally; hide the
        # container copies so responses never carry conflicting duplicates.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-XSS-Protection;
        proxy_hide_header Referrer-Policy;
    }

    # ── Cloud console, API, and webhooks ─────────────────────────────────────
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        proxy_pass http://127.0.0.1:8093;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/auth.krewire.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/auth.krewire.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = cloud.krewire.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name cloud.krewire.com;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot
}
