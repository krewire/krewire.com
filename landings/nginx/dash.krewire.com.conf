# Edge routing for dash.krewire.com
# Canonical source: krewire.com/landings/nginx/dash.krewire.com.conf
# Install: sudo install -m 0644 <this file> /etc/nginx/sites-available/dash.krewire.com
#          sudo nginx -t && sudo systemctl reload nginx
#
# Layout:
#   /          -> static landing page container (krewire-landing-dash, 127.0.0.1:8094)
#   /shared/*  -> static landing page assets (krewire-landing-dash, 127.0.0.1:8094)
#   /console   -> Dash console SPA (krewire-dash, 127.0.0.1:8092)
#   /*         -> Dash daemon (API + WebSocket upgrade)
server {
    server_name dash.krewire.com;

    # ── Product landing page ─────────────────────────────────────────────────
    location = / {
        limit_req zone=general_limit burst=100 nodelay;
        proxy_pass http://127.0.0.1:8094;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        # Edge (conf.d/security.conf) already sets these globally; hide the
        # container copies so responses never carry conflicting duplicates.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-XSS-Protection;
        proxy_hide_header Referrer-Policy;
    }

    # ── Shared static assets for landing page ────────────────────────────────
    location /shared/ {
        limit_req zone=general_limit burst=100 nodelay;
        proxy_pass http://127.0.0.1:8094;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-XSS-Protection;
        proxy_hide_header Referrer-Policy;
    }

    # ── Dash console: serve the SPA entry point at /console ──────────────────
    location = /console {
        limit_req zone=general_limit burst=100 nodelay;
        proxy_pass http://127.0.0.1:8092/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
    }

    location = /console/ {
        limit_req zone=general_limit burst=100 nodelay;
        proxy_pass http://127.0.0.1:8092/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
    }

    # ── Console API, WebSocket, and health endpoints ─────────────────────────
    location / {
        limit_req zone=general_limit burst=100 nodelay;
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/auth.krewire.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/auth.krewire.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = dash.krewire.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name dash.krewire.com;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot
}
