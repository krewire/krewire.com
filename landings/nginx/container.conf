server {
    listen 80;
    listen [::]:80;
    server_name _;

    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    location = /_health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The landing page is a single self-contained document.
    location = / {
        try_files /index.html =404;
    }

    # Shared design system is content-hashed by the image tag, never by URL.
    location /shared/ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
}
