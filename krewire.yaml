# Krewire Devtool Configuration (kiw)
# Controls kiw devtool behavior within the project.
# Application settings (titles, navigation, themes, etc.) belong in pages, layouts, and components.

project:
  name: "krewire"
  kind: site
  version: "v0.1.0"
  author: "Krewire Contributors"

title: "Krewire"

nav:
  - text: "Get Started"
    url: "/docs/getting-started"
  - text: "Workloads"
    url: "/docs/workloads"
  - text: "DSL"
    url: "/docs/getting-started/dsl"
  - text: "Docs"
    url: "/docs"
  - text: "Ecosystem"
    url: "/#ecosystem"
  - text: "GitHub"
    url: "https://github.com/krewire/krewire"

# Content directory for documentation manuscripts (pkg/book)
input: "content/en/docs"
output: ".krewire/build"

# Devtool build pipeline configuration
build:
  output: ".krewire/build"
  base: "/"

# Dev server configuration
dev:
  port: 8080

# Book configuration for documentation manuscript
book:
  mount: "/docs"
  toc: true

# Internationalization: supported locales for docs content.
# Content lives under content/<locale>/docs/ (e.g. content/en/docs/, content/id/docs/).
# Build output goes to .krewire/build/<locale>/docs/...
i18n:
  default_locale: "en"
  fallback_locale: "en"
  base_path: "lang"
  locales: ["en", "id"]

# Asset injection and bundling
auto_assets:
  bundle: true
