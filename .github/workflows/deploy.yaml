name: Deploy to krewire.com (Production)

# ─────────────────────────────────────────────────────────────────────────────
# Trigger on stable version git tags only (e.g. v0.1.0, v1.0.0, v2.1.3).
# Pre-releases, development branches, and raw commits must pass through
# the release process before reaching production.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual production deployment'
        required: false
        default: 'Manual maintenance trigger'

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Build the static site with strict quality gates
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build site (Production Gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Release Tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "▶ Validating stable release tag: ${TAG}"
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "✗ Error: '${TAG}' is not a valid stable SemVer tag."
            exit 1
          fi
          echo "✓ Stable version tag validated: ${TAG}"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          check-latest: true
          cache: true

      - name: Install kiw CLI
        run: |
          git clone --depth 1 --branch main "https://github.com/krewire/krewire.git" "${RUNNER_TEMP}/krewire"
          git clone --depth 1 --branch main "https://github.com/krewire/mdbind.git" "${RUNNER_TEMP}/mdbind"
          cd "${RUNNER_TEMP}/krewire"
          go build -o "${RUNNER_TEMP}/bin/kiw" ./tools/kiw/cmd/kiw
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Verify kiw installation
        run: kiw version

      - name: Build contributor portal (krewire.github.io → public/contribute)
        run: |
          # The contributor portal is a separate repository built with the
          # same `kiw` toolchain. It is mounted under /contribute/ on
          # krewire.com, so it is built here from source (never committed as
          # a stale artifact) and dropped into public/, which `kiw build`
          # copies verbatim into the site output.
          git clone --depth 1 --branch main "https://github.com/krewire/krewire.github.io.git" "${RUNNER_TEMP}/portal"
          ( cd "${RUNNER_TEMP}/portal" && kiw build --base /contribute/ )
          rm -rf public/contribute
          mkdir -p public/contribute
          cp -a "${RUNNER_TEMP}/portal/.krewire/build/." public/contribute/
          test -f public/contribute/index.html || { echo "✗ portal build missing index.html"; exit 1; }
          # Every portal asset must resolve under /contribute/ (build.base),
          # never the root site's /assets/ — otherwise it loads the wrong CSS/JS.
          if grep -qE '(href|src)="/assets/' public/contribute/index.html; then
            echo "✗ portal emitted root-absolute /assets/ URLs (build.base not applied)"; exit 1
          fi
          echo "✓ Contributor portal built into public/contribute with /contribute/ base."

      - name: Build static site
        run: |
          # `kiw build` emits the complete site, including the shared asset plan:
          # every page already links style.css → tailwind.css →
          # theme.css → mdbind.css and the site scripts, in cascade order with
          # ?v=<version> cache busting. No post-processing step may reorder or
          # re-link those assets.
          kiw build

      - name: Verify asset injection
        run: |
          cd .krewire/build
          fail=0
          # The bundle must hold on every page, landing and docs alike.
          for page in index.html docs/index.html docs/overview.html docs/getting-started/configuration.html; do
            test -f "$page" || { echo "✗ missing page $page"; fail=1; continue; }
            grep -q 'href="/assets/krewire\.css?v=' "$page" || { echo "✗ $page missing krewire.css"; fail=1; }
            grep -q '<script src="/assets/krewire\.js?v=' "$page" || { echo "✗ $page missing krewire.js"; fail=1; }
            case "$page" in
              docs/*)
                grep -q 'href="/docs/assets/mdbind\.css?v=' "$page" || { echo "✗ $page missing mdbind.css"; fail=1; }
                ;;
            esac
          done
          test -f assets/krewire.css || { echo "✗ missing assets/krewire.css"; fail=1; }
          test -f assets/krewire.js || { echo "✗ missing assets/krewire.js"; fail=1; }
          [ "$fail" -eq 0 ] || { echo "✗ asset injection verification failed"; exit 1; }
          echo "✓ Asset bundle and cache busting verified on landing and docs pages."

      - name: Verify build outputs
        run: |
          test -f .krewire/build/index.html
          test -d .krewire/build/assets
          test -f .krewire/build/assets/krewire.css
          test -f .krewire/build/assets/krewire.js
          test -f .krewire/build/docs/index.html
          test -f .krewire/build/docs/getting-started.html
          test -f .krewire/build/docs/overview.html
          test -f .krewire/build/scripts/install.sh
          # Verify install.sh is plain text (not binary) — content integrity check
          file .krewire/build/scripts/install.sh | grep -q "shell script\|text"
          echo "✓ All required build outputs present."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build-${{ github.sha }}
          path: .krewire/build
          retention-days: 3
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Build Docker image & deploy to VPS with atomic zero-downtime & rollback
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS (Production Release)
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://krewire.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build-${{ github.sha }}
          path: .krewire/build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Version Tags
        id: meta
        run: |
          RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
            echo "image_tags=krewire-web:${{ github.sha }},krewire-web:${RELEASE_TAG},krewire-web:latest" >> "$GITHUB_OUTPUT"
          else
            echo "version_tag=manual-${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "image_tags=krewire-web:${{ github.sha }},krewire-web:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.image_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export Docker image (with integrity checksum)
        run: |
          docker save krewire-web:${{ github.sha }} | gzip > /tmp/krewire-web.tar.gz
          sha256sum /tmp/krewire-web.tar.gz > /tmp/krewire-web.tar.gz.sha256
          echo "Image checksum:"
          cat /tmp/krewire-web.tar.gz.sha256

      - name: Configure SSH (strict host key verification)
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Write private key
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Write known_hosts fingerprint — provided as a repository secret.
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Copy Docker image to VPS (with checksum)
        run: |
          scp -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              /tmp/krewire-web.tar.gz \
              /tmp/krewire-web.tar.gz.sha256 \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/

      - name: Deploy on VPS
        env:
          SHA: ${{ github.sha }}
          VERSION: ${{ steps.meta.outputs.version_tag }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash -s "${{ github.sha }}" "${{ steps.meta.outputs.version_tag }}" << 'REMOTE'
            set -euo pipefail
            SHA="$1"
            VERSION="$2"

            echo "▶ Verifying image checksum on VPS..."
            sha256sum -c /tmp/krewire-web.tar.gz.sha256 \
              || { echo "✗ Checksum mismatch — aborting deploy."; exit 1; }
            echo "✓ Checksum verified."

            echo "▶ Loading Docker image..."
            docker load < /tmp/krewire-web.tar.gz

            echo "▶ Tagging image..."
            docker tag "krewire-web:${SHA}" krewire-web:latest
            if [ -n "${VERSION}" ]; then
              docker tag "krewire-web:${SHA}" "krewire-web:${VERSION}"
            fi

            echo "▶ Saving previous image tag for rollback..."
            PREV_ID="$(docker inspect --format='{{.Id}}' krewire-web:previous 2>/dev/null || true)"

            echo "▶ Restarting container..."
            cd ~/workspace/krewire/krewire.com
            docker rm -f krewire-web 2>/dev/null || true
            docker compose up -d --no-build

            echo "▶ Waiting for container to become healthy..."
            HEALTHY=false
            for i in $(seq 1 20); do
              STATUS="$(docker inspect --format='{{.State.Health.Status}}' krewire-web 2>/dev/null || echo 'unknown')"
              printf "  [%2d/20] Health: %s\n" "$i" "$STATUS"
              if [ "$STATUS" = "healthy" ]; then
                HEALTHY=true
                break
              fi
              if [ "$STATUS" = "unhealthy" ]; then
                echo "✗ Container is unhealthy after startup — initiating rollback."
                break
              fi
              sleep 3
            done

            if [ "$HEALTHY" = "false" ]; then
              echo "✗ Health check failed — rolling back to previous image."
              if [ -n "$PREV_ID" ]; then
                docker tag "$PREV_ID" krewire-web:latest
                docker rm -f krewire-web 2>/dev/null || true
                docker compose up -d --no-build
                echo "✓ Rollback complete."
              else
                echo "⚠ No previous image available for rollback."
              fi
              exit 1
            fi

            echo "▶ Tagging deployed image as :previous and :stable for rollback baseline..."
            docker tag krewire-web:latest krewire-web:previous
            docker tag krewire-web:latest krewire-web:stable
            if [ -n "${VERSION}" ]; then
              docker tag krewire-web:latest "krewire-web:${VERSION}"
            fi

            echo "▶ Cleaning up transfer files..."
            rm -f /tmp/krewire-web.tar.gz /tmp/krewire-web.tar.gz.sha256

            echo "▶ Pruning dangling images (not removing tagged images)..."
            docker image prune -f --filter "label!=com.krewire.keep=true"

            echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] PRODUCTION DEPLOY: version=${VERSION} sha=${SHA}" >> ~/workspace/krewire/deploy.log

            echo "✓ Production deployment complete for ${VERSION}."
          REMOTE

      - name: Smoke test — verify live site
        run: |
          echo "▶ Smoke testing https://krewire.com ..."
          sleep 5
          HTTP_CODE="$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://krewire.com/ 2>/dev/null || true)"
          if [ "${HTTP_CODE}" = "200" ]; then
            echo "✓ Live site returned HTTP ${HTTP_CODE}."
          else
            echo "✗ Smoke test failed: HTTP ${HTTP_CODE} from https://krewire.com"
            exit 1
          fi
          # Verify the installer script is reachable and is plain text
          SH_CODE="$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://krewire.com/scripts/install.sh 2>/dev/null || true)"
          if [ "${SH_CODE}" = "200" ]; then
            echo "✓ install.sh reachable (HTTP ${SH_CODE})."
          else
            echo "⚠ install.sh returned HTTP ${SH_CODE} — check nginx routing."
            exit 1
          fi
          # Verify docs path is reachable directly (HTTP 200, no redirect)
          DOCS_CODE="$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://krewire.com/docs 2>/dev/null || true)"
          if [ "${DOCS_CODE}" = "200" ]; then
            echo "✓ /docs reachable directly (HTTP ${DOCS_CODE})."
          else
            echo "✗ /docs returned HTTP ${DOCS_CODE} (expected 200)."
            exit 1
          fi
          # Verify legacy /contribute/ redirects (301) to open.krewire.com
          CONTRIB_CODE="$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://krewire.com/contribute/ 2>/dev/null || true)"
          if [ "${CONTRIB_CODE}" = "301" ]; then
            echo "✓ /contribute/ redirected (HTTP ${CONTRIB_CODE})."
          else
            echo "✗ /contribute/ returned HTTP ${CONTRIB_CODE} (expected 301)."
            exit 1
          fi
          echo "✓ All production smoke tests passed."
