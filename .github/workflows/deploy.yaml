name: Deploy to krewire.com (Production)

# ─────────────────────────────────────────────────────────────────────────────
# Trigger on verified stable version git tags and successful stable Release Pipelines.
# Pre-releases, experimental tracks, development branches, and failed pipeline runs
# are strictly blocked from reaching the production portal (ADR-R7P3K / krewire.com#43).
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-lts*'
  workflow_run:
    workflows: ["Release Pipeline"]
    types: [completed]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Auditable reason for manual production deployment'
        required: true
        default: 'Production maintenance deployment'

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Release Policy & Gate Verification (Strict Security Boundary)
  # ─────────────────────────────────────────────────────────────────────────────
  gate:
    name: Verify Release Gate & Track
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy_sha: ${{ steps.verify.outputs.deploy_sha }}
      deploy_version: ${{ steps.verify.outputs.deploy_version }}
      deploy_track: ${{ steps.verify.outputs.deploy_track }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify Release Policy Matrix Conformance
        run: ./scripts/verify_release_matrix.sh

      - name: Verify Event & Enforce Release Policy
        id: verify
        run: |
          EVENT="${{ github.event_name }}"
          echo "=========================================================="
          echo "▶ Evaluating production deployment trigger: ${EVENT}"
          echo "=========================================================="

          DEPLOY_SHA=""
          DEPLOY_VERSION=""
          DEPLOY_TRACK=""

          if [ "${EVENT}" = "workflow_run" ]; then
            CONCLUSION="${{ github.event.workflow_run.conclusion }}"
            WORKFLOW_NAME="${{ github.event.workflow_run.name }}"
            HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
            HEAD_SHA="${{ github.event.workflow_run.head_sha }}"

            echo "Originating Workflow: ${WORKFLOW_NAME}"
            echo "Workflow Conclusion:  ${CONCLUSION}"
            echo "Originating Ref/Tag:  ${HEAD_BRANCH}"
            echo "Originating Head SHA: ${HEAD_SHA}"

            # 1. Gate on successful completion
            if [ "${CONCLUSION}" != "success" ]; then
              echo "✗ ERROR: Originating Release Pipeline conclusion is '${CONCLUSION}' (expected: 'success'). Deployment aborted."
              exit 1
            fi

            # 2. Gate on non-empty head SHA
            if [ -z "${HEAD_SHA}" ]; then
              echo "✗ ERROR: Missing originating head_sha. Deployment aborted."
              exit 1
            fi

            # 3. Reject pre-release, experimental, and dev tracks
            if [[ "${HEAD_BRANCH}" =~ -rc|-beta|-alpha|-exp|-dev|-nightly ]]; then
              echo "✗ ERROR: Pre-release, experimental, or dev track '${HEAD_BRANCH}' cannot deploy to production."
              exit 1
            fi

            # 4. Enforce SemVer stable or LTS tag pattern
            if [[ ! "${HEAD_BRANCH}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-lts.*)?$ ]]; then
              echo "✗ ERROR: Ref '${HEAD_BRANCH}' is not a valid stable or LTS release tag. Default branch and untagged builds cannot deploy to production."
              exit 1
            fi

            DEPLOY_SHA="${HEAD_SHA}"
            DEPLOY_VERSION="${HEAD_BRANCH}"
            DEPLOY_TRACK="stable"
            if [[ "${HEAD_BRANCH}" =~ -lts ]]; then DEPLOY_TRACK="lts"; fi

          elif [ "${EVENT}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "Push Tag: ${TAG}"
            echo "Commit:   ${GITHUB_SHA}"

            if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-lts.*)?$ ]]; then
              echo "✗ ERROR: '${TAG}' is not a valid stable or LTS SemVer tag."
              exit 1
            fi

            DEPLOY_SHA="${GITHUB_SHA}"
            DEPLOY_VERSION="${TAG}"
            DEPLOY_TRACK="stable"
            if [[ "${TAG}" =~ -lts ]]; then DEPLOY_TRACK="lts"; fi

          elif [ "${EVENT}" = "workflow_dispatch" ]; then
            REASON="${{ inputs.reason }}"
            if [ -z "${REASON}" ] || [ "${REASON}" = "none" ]; then
              echo "✗ ERROR: Manual production deployment requires an auditable reason."
              exit 1
            fi

            DEPLOY_SHA="${GITHUB_SHA}"
            DEPLOY_VERSION="manual-${GITHUB_SHA::7}"
            DEPLOY_TRACK="manual"
            echo "▶ Manual deployment authorized by @${{ github.actor }}. Reason: ${REASON}"

          else
            echo "✗ ERROR: Unsupported event '${EVENT}'."
            exit 1
          fi

          echo "deploy_sha=${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"
          echo "deploy_version=${DEPLOY_VERSION}" >> "$GITHUB_OUTPUT"
          echo "deploy_track=${DEPLOY_TRACK}" >> "$GITHUB_OUTPUT"
          echo "✓ Gate validation passed. Deploying Version: ${DEPLOY_VERSION} (Track: ${DEPLOY_TRACK}) at SHA: ${DEPLOY_SHA}"

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Build the static site with strict quality gates
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build site (Production Gate)
    needs: [gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Verified Commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.gate.outputs.deploy_sha }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: "stable"
          check-latest: true
          cache: true

      - name: Install canonical Krew CLI
        run: |
          git clone --depth 1 --branch main "https://github.com/krewire/krewire.git" "${RUNNER_TEMP}/krewire"
          git clone --depth 1 --branch main "https://github.com/krewire/ui.git" "${RUNNER_TEMP}/ui"
          git clone --depth 1 --branch main "https://github.com/krewire/tui.git" "${RUNNER_TEMP}/tui"
          git clone --depth 1 --branch main "https://github.com/krewire/krew.git" "${RUNNER_TEMP}/krew"
          cd "${RUNNER_TEMP}"
          go work init ./krewire ./ui ./tui ./krew
          cd "${RUNNER_TEMP}/krew"
          go build -o "${RUNNER_TEMP}/bin/krew" ./cmd/krew
          ln -sf "${RUNNER_TEMP}/bin/krew" "${RUNNER_TEMP}/bin/kiw"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Verify krew installation
        run: krew version

      - name: Build static site
        run: |
          krew build

      - name: Verify asset injection
        run: |
          cd .krewire/build
          fail=0
          # The bundle must hold on every page, landing and docs alike.
          for page in index.html docs/index.html docs/overview.html docs/getting-started/configuration.html; do
            test -f "$page" || { echo "✗ missing page $page"; fail=1; continue; }
            grep -q 'href="/assets/krewire\.css?v=' "$page" || { echo "✗ $page missing krewire.css"; fail=1; }
            grep -q '<script src="/assets/krewire\.js?v=' "$page" || { echo "✗ $page missing krewire.js"; fail=1; }
          done
          test -f assets/krewire.css || { echo "✗ missing assets/krewire.css"; fail=1; }
          test -f assets/krewire.js || { echo "✗ missing assets/krewire.js"; fail=1; }
          [ "$fail" -eq 0 ] || { echo "✗ asset injection verification failed"; exit 1; }
          echo "✓ Asset bundle and cache busting verified on landing and docs pages."

      - name: Verify build outputs
        run: |
          test -f .krewire/build/index.html
          test -d .krewire/build/assets
          test -f .krewire/build/assets/krewire.css
          test -f .krewire/build/assets/krewire.js
          test -f .krewire/build/docs/index.html
          test -f .krewire/build/docs/getting-started.html
          test -f .krewire/build/docs/overview.html
          test -f .krewire/build/scripts/install.sh
          # Verify install.sh is plain text (not binary) — content integrity check
          file .krewire/build/scripts/install.sh | grep -q "shell script\|text"
          echo "✓ All required build outputs present."

      - name: Generate Build Provenance Checksums
        run: |
          cd .krewire/build
          find . -type f -exec sha256sum {} + | sort -k2 > BUILD_MANIFEST.sha256
          echo "▶ Build manifest generated ($(wc -l < BUILD_MANIFEST.sha256) files):"
          head -n 10 BUILD_MANIFEST.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: site-build-${{ needs.gate.outputs.deploy_sha }}
          path: .krewire/build
          retention-days: 3
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3 — Build Docker image & deploy to VPS with atomic zero-downtime & rollback
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS (Production Release)
    runs-on: ubuntu-latest
    needs: [gate, build]
    permissions:
      contents: read
    environment:
      name: production
      url: https://krewire.com
    steps:
      - name: Checkout Verified Commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.gate.outputs.deploy_sha }}

      - name: Download build artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: site-build-${{ needs.gate.outputs.deploy_sha }}
          path: .krewire/build

      - name: Verify Downloaded Manifest Checksum
        run: |
          cd .krewire/build
          sha256sum -c BUILD_MANIFEST.sha256 > /dev/null
          echo "✓ Build manifest integrity verified before Docker packaging."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Determine Version Tags
        id: meta
        run: |
          VERSION="${{ needs.gate.outputs.deploy_version }}"
          SHA="${{ needs.gate.outputs.deploy_sha }}"
          if [[ "${VERSION}" =~ ^v[0-9]+ ]]; then
            echo "version_tag=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "image_tags=krewire-app:${SHA},krewire-app:${VERSION},krewire-app:latest" >> "$GITHUB_OUTPUT"
          else
            echo "version_tag=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "image_tags=krewire-app:${SHA},krewire-app:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.image_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export Docker image (with integrity checksum)
        run: |
          docker save krewire-app:${{ needs.gate.outputs.deploy_sha }} | gzip > /tmp/krewire-app.tar.gz
          sha256sum /tmp/krewire-app.tar.gz > /tmp/krewire-app.tar.gz.sha256
          echo "Image checksum:"
          cat /tmp/krewire-app.tar.gz.sha256

      - name: Configure SSH (strict host key verification)
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Write private key
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Write known_hosts fingerprint — provided as a repository secret.
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify VPS SSH Reachability
        id: check_ssh
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS credentials not configured. Skipping remote SSH deploy."
            exit 0
          fi
          if ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=5 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" echo "ok" 2>/dev/null; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
            echo "✓ VPS SSH is reachable."
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS SSH unreachable from runner (e.g. host proxied via Cloudflare). Production container is maintained directly on host per AGENTS.md."
          fi

      - name: Copy Docker image to VPS (with checksum)
        if: steps.check_ssh.outputs.reachable == 'true'
        run: |
          scp -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              /tmp/krewire-app.tar.gz \
              /tmp/krewire-app.tar.gz.sha256 \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/

      - name: Deploy on VPS
        if: steps.check_ssh.outputs.reachable == 'true'
        env:
          SHA: ${{ needs.gate.outputs.deploy_sha }}
          VERSION: ${{ steps.meta.outputs.version_tag }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash -s "${{ needs.gate.outputs.deploy_sha }}" "${{ steps.meta.outputs.version_tag }}" << 'REMOTE'
            set -euo pipefail
            SHA="$1"
            VERSION="$2"

            echo "▶ Verifying image checksum on VPS..."
            sha256sum -c /tmp/krewire-app.tar.gz.sha256 \
              || { echo "✗ Checksum mismatch — aborting deploy."; exit 1; }
            echo "✓ Checksum verified."

            echo "▶ Loading Docker image..."
            docker load < /tmp/krewire-app.tar.gz

            echo "▶ Tagging image..."
            docker tag "krewire-app:${SHA}" krewire-app:latest
            if [ -n "${VERSION}" ]; then
              docker tag "krewire-app:${SHA}" "krewire-app:${VERSION}"
            fi

            echo "▶ Saving previous image tag for rollback..."
            PREV_ID="$(docker inspect --format='{{.Id}}' krewire-app:previous 2>/dev/null || true)"

            echo "▶ Restarting container..."
            cd ~/workspace/krewire/krewire.com
            docker rm -f krewire-app 2>/dev/null || true
            docker compose up -d --no-build

            echo "▶ Waiting for container to become healthy..."
            HEALTHY=false
            for i in $(seq 1 20); do
              STATUS="$(docker inspect --format='{{.State.Health.Status}}' krewire-app 2>/dev/null || echo 'unknown')"
              printf "  [%2d/20] Health: %s\n" "$i" "$STATUS"
              if [ "$STATUS" = "healthy" ]; then
                HEALTHY=true
                break
              fi
              if [ "$STATUS" = "unhealthy" ]; then
                echo "✗ Container is unhealthy after startup — initiating rollback."
                break
              fi
              sleep 3
            done

            if [ "$HEALTHY" = "false" ]; then
              echo "✗ Health check failed — rolling back to previous image."
              if [ -n "$PREV_ID" ]; then
                docker tag "$PREV_ID" krewire-app:latest
                docker rm -f krewire-app 2>/dev/null || true
                docker compose up -d --no-build
                echo "✓ Rollback complete."
              else
                echo "⚠ No previous image available for rollback."
              fi
              exit 1
            fi

            echo "▶ Tagging deployed image as :previous and :stable for rollback baseline..."
            docker tag krewire-app:latest krewire-app:previous
            docker tag krewire-app:latest krewire-app:stable
            if [ -n "${VERSION}" ]; then
              docker tag krewire-app:latest "krewire-app:${VERSION}"
            fi

            echo "▶ Cleaning up transfer files..."
            rm -f /tmp/krewire-app.tar.gz /tmp/krewire-app.tar.gz.sha256

            echo "▶ Pruning dangling images (not removing tagged images)..."
            docker image prune -f --filter "label!=com.krewire.keep=true"

            echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] PRODUCTION DEPLOY: version=${VERSION} sha=${SHA}" >> ~/workspace/krewire/deploy.log

            echo "✓ Production deployment complete for ${VERSION}."
          REMOTE

      - name: Smoke test — verify live site
        run: |
          echo "▶ Smoke testing https://krewire.com ..."
          sleep 5
          HTTP_CODE="$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://krewire.com/ 2>/dev/null || true)"
          if [ "${HTTP_CODE}" = "200" ]; then
            echo "✓ Live site returned HTTP ${HTTP_CODE}."
          else
            echo "✗ Smoke test failed: HTTP ${HTTP_CODE} from https://krewire.com"
            exit 1
          fi
          # Verify the installer script is reachable and is plain text
          SH_CODE="$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://krewire.com/scripts/install.sh 2>/dev/null || true)"
          if [ "${SH_CODE}" = "200" ]; then
            echo "✓ install.sh reachable (HTTP ${SH_CODE})."
          else
            echo "⚠ install.sh returned HTTP ${SH_CODE} — check nginx routing."
            exit 1
          fi
          # Verify docs path is reachable directly (HTTP 200, no redirect)
          DOCS_CODE="$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://krewire.com/docs 2>/dev/null || true)"
          if [ "${DOCS_CODE}" = "200" ]; then
            echo "✓ /docs reachable directly (HTTP ${DOCS_CODE})."
          else
            echo "✗ /docs returned HTTP ${DOCS_CODE} (expected 200)."
            exit 1
          fi
          echo "✓ All production smoke tests passed."
