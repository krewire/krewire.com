name: Emergency Hotfix Deploy to krewire.com (Protocol Bypass with Stable Fallback)

# ─────────────────────────────────────────────────────────────────────────────
# EMERGENCY HOTFIX DEPLOYMENT WORKFLOW
#
# Bypasses standard production deployment protocols (stable git tag requirement,
# release gating, and multi-stage approval).
#
# Triggered immediately upon any push/commit to 'hotfix' or 'hotfix/**' branches.
#
# SAFETY GUARANTEE:
# If the emergency hotfix fails to boot, fails container health checks, or
# fails live smoke tests, the workflow IMMEDIATELY rolls back to the last known
# STABLE production version (krewire-web:stable / v*.*.*).
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - 'hotfix'
      - 'hotfix/**'
      - 'hotfix-*'
  workflow_dispatch:
    inputs:
      hotfix_description:
        description: 'Brief description of emergency hotfix reason'
        required: false
        default: 'Emergency patch via workflow_dispatch'

concurrency:
  group: deploy-production
  cancel-in-progress: false # Do not abort in-flight hotfix deployments

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Fast Build Site Artifacts
  # ─────────────────────────────────────────────────────────────────────────────
  build-hotfix:
    name: Build Hotfix (Fast Track)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Hotfix Branch
        uses: actions/checkout@v4

      - name: Log Hotfix Trigger & Audit Trail
        run: |
          echo "=========================================================="
          echo "🚨 EMERGENCY HOTFIX PIPELINE TRIGGERED"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor:  ${{ github.actor }}"
          echo "Protocol: BYPASS (Direct Branch Commit)"
          echo "Fallback: Automatic rollback to STABLE VERSION on failure"
          echo "=========================================================="

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          check-latest: true
          cache: true

      - name: Install kiw CLI
        run: |
          git clone --depth 1 --branch main "https://github.com/krewire/krewire.git" "${RUNNER_TEMP}/krewire"
          git clone --depth 1 --branch main "https://github.com/krewire/mdbind.git" "${RUNNER_TEMP}/mdbind"
          cd "${RUNNER_TEMP}/krewire"
          go build -o "${RUNNER_TEMP}/bin/kiw" ./tools/kiw/cmd/kiw
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Build contributor portal (krewire.github.io → public/contribute)
        run: |
          git clone --depth 1 --branch main "https://github.com/krewire/krewire.github.io.git" "${RUNNER_TEMP}/portal"
          ( cd "${RUNNER_TEMP}/portal" && kiw build --base /contribute/ )
          rm -rf public/contribute
          mkdir -p public/contribute
          cp -a "${RUNNER_TEMP}/portal/.krewire/build/." public/contribute/
          test -f public/contribute/index.html || { echo "✗ portal build missing index.html"; exit 1; }
          if grep -qE '(href|src)="/assets/' public/contribute/index.html; then
            echo "✗ portal emitted root-absolute /assets/ URLs (build.base not applied)"; exit 1
          fi
          echo "✓ Contributor portal built into public/contribute with /contribute/ base."

      - name: Build static site (Hotfix)
        run: kiw build
      - name: Fast sanity check of build outputs
        run: |
          test -f .krewire/build/index.html || { echo "✗ Missing index.html"; exit 1; }
          test -f .krewire/build/docs/index.html || { echo "✗ Missing docs/index.html"; exit 1; }
          test -f .krewire/build/id/docs/index.html || { echo "✗ Missing id/docs/index.html"; exit 1; }
          test -d .krewire/build/assets || { echo "✗ Missing assets directory"; exit 1; }
          test -f .krewire/build/assets/krewire.css || { echo "✗ Missing assets/krewire.css"; exit 1; }
          test -f .krewire/build/assets/krewire.js || { echo "✗ Missing assets/krewire.js"; exit 1; }
          echo "✓ Fast sanity checks passed."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hotfix-build-${{ github.sha }}
          path: .krewire/build
          retention-days: 1
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Direct Emergency Deploy to VPS with Fallback to Stable
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-hotfix:
    name: Deploy Hotfix (Immediate Bypass with Stable Fallback)
    runs-on: ubuntu-latest
    needs: build-hotfix
    environment:
      name: production
      url: https://krewire.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: hotfix-build-${{ github.sha }}
          path: .krewire/build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Hotfix Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: |
            krewire-web:hotfix-${{ github.sha }}
            krewire-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export Docker image (with checksum)
        run: |
          docker save krewire-web:hotfix-${{ github.sha }} | gzip > /tmp/krewire-hotfix.tar.gz
          sha256sum /tmp/krewire-hotfix.tar.gz > /tmp/krewire-hotfix.tar.gz.sha256
          echo "Hotfix image checksum:"
          cat /tmp/krewire-hotfix.tar.gz.sha256

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Copy Hotfix Image to VPS
        run: |
          scp -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              /tmp/krewire-hotfix.tar.gz \
              /tmp/krewire-hotfix.tar.gz.sha256 \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/

      - name: Apply Hotfix Directly on VPS (with Automatic Stable Fallback)
        env:
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash -s "${{ github.sha }}" "${{ github.ref_name }}" "${{ github.actor }}" << 'REMOTE'
            set -euo pipefail
            SHA="$1"
            BRANCH="$2"
            ACTOR="$3"

            echo "▶ [HOTFIX] Identifying current STABLE version as safe fallback target..."
            STABLE_IMAGE=""
            if docker inspect --type=image krewire-web:stable >/dev/null 2>&1; then
              STABLE_IMAGE="krewire-web:stable"
            elif STABLE_TAG=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep '^krewire-web:v[0-9]' | sort -V | tail -n 1) && [ -n "$STABLE_TAG" ]; then
              STABLE_IMAGE="$STABLE_TAG"
            elif docker inspect --type=image krewire-web:previous >/dev/null 2>&1; then
              STABLE_IMAGE="krewire-web:previous"
            elif docker inspect --type=image krewire-web:latest >/dev/null 2>&1; then
              STABLE_IMAGE="krewire-web:latest"
            fi
            echo "✓ Pinned STABLE fallback baseline: ${STABLE_IMAGE:-none}"

            echo "▶ [HOTFIX] Verifying image checksum on VPS..."
            sha256sum -c /tmp/krewire-hotfix.tar.gz.sha256 \
              || { echo "✗ Checksum mismatch — aborting hotfix deploy."; exit 1; }
            echo "✓ Checksum verified."

            echo "▶ [HOTFIX] Loading Docker image..."
            docker load < /tmp/krewire-hotfix.tar.gz

            echo "▶ [HOTFIX] Tagging image as latest and hotfix-${SHA}..."
            docker tag "krewire-web:hotfix-${SHA}" krewire-web:latest

            echo "▶ [HOTFIX] Restarting container with emergency patch..."
            cd ~/workspace/krewire/krewire.com
            docker rm -f krewire-web 2>/dev/null || true
            docker compose up -d --no-build

            echo "▶ [HOTFIX] Verifying container health..."
            HEALTHY=false
            for i in $(seq 1 15); do
              STATUS="$(docker inspect --format='{{.State.Health.Status}}' krewire-web 2>/dev/null || echo 'unknown')"
              printf "  [%2d/15] Health: %s\n" "$i" "$STATUS"
              if [ "$STATUS" = "healthy" ]; then
                HEALTHY=true
                break
              fi
              if [ "$STATUS" = "unhealthy" ]; then
                echo "✗ Hotfix container unhealthy — initiating immediate fallback to STABLE!"
                break
              fi
              sleep 2
            done

            if [ "$HEALTHY" = "false" ]; then
              echo "🚨 EMERGENCY HOTFIX FAILED HEALTHCHECK! Executing automatic fallback to STABLE VERSION: ${STABLE_IMAGE}"
              if [ -n "$STABLE_IMAGE" ]; then
                docker tag "$STABLE_IMAGE" krewire-web:latest
                docker rm -f krewire-web 2>/dev/null || true
                docker compose up -d --no-build
                echo "✓ Automatic fallback to stable version (${STABLE_IMAGE}) completed. VPS restored."
              else
                echo "⚠ No stable fallback image identified."
              fi
              echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] 🚨 HOTFIX FAILED & ROLLED BACK: branch=${BRANCH} commit=${SHA} restored_to=${STABLE_IMAGE}" >> ~/workspace/krewire/deploy.log
              exit 1
            fi

            echo "✓ Hotfix container is healthy and actively serving traffic."

            echo "▶ Cleaning up temporary files..."
            rm -f /tmp/krewire-hotfix.tar.gz /tmp/krewire-hotfix.tar.gz.sha256

            # Record emergency hotfix to persistent audit log
            echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] 🚨 EMERGENCY HOTFIX APPLIED: branch=${BRANCH} commit=${SHA} actor=${ACTOR} (Protocol Bypass)" >> ~/workspace/krewire/deploy.log

            echo "✓ EMERGENCY HOTFIX SUCCESSFULLY DEPLOYED."
          REMOTE

      - name: Hotfix Smoke Test
        run: |
          echo "▶ Verifying hotfix live response on https://krewire.com ..."
          sleep 3
          HTTP_CODE="$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://krewire.com/ 2>/dev/null || true)"
          if [ "${HTTP_CODE}" = "200" ]; then
            echo "✓ Live site responded HTTP 200 after emergency hotfix."
          else
            echo "✗ Smoke test failed: HTTP ${HTTP_CODE} — initiating fallback step!"
            exit 1
          fi
          CONTRIB_CODE="$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://krewire.com/contribute/ 2>/dev/null || true)"
          if [ "${CONTRIB_CODE}" = "301" ]; then
            echo "✓ /contribute/ redirected to open.krewire.com (HTTP 301)."
          else
            echo "✗ Smoke test failed: /contribute/ returned HTTP ${CONTRIB_CODE} (expected 301)."
            exit 1
          fi
          DOCS_CODE="$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://krewire.com/docs/ 2>/dev/null || true)"
          if [ "${DOCS_CODE}" = "200" ]; then
            echo "✓ /docs/ responded HTTP 200 after emergency hotfix."
          else
            echo "✗ Smoke test failed: /docs/ returned HTTP ${DOCS_CODE}."
            exit 1
          fi
          ID_DOCS_CODE="$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://krewire.com/id/docs/ 2>/dev/null || true)"
          if [ "${ID_DOCS_CODE}" = "200" ]; then
            echo "✓ /id/docs/ responded HTTP 200 after emergency hotfix."
          else
            echo "✗ Smoke test failed: /id/docs/ returned HTTP ${ID_DOCS_CODE}."
            exit 1
          fi

      - name: Emergency Fallback to Stable on Failure
        if: failure()
        run: |
          echo "🚨 HOTFIX STAGE FAILED! Triggering remote emergency fallback to STABLE VERSION on VPS..."
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash << 'REMOTE'
            set -euo pipefail
            cd ~/workspace/krewire/krewire.com
            # Find stable image
            if docker inspect --type=image krewire-web:stable >/dev/null 2>&1; then
              FALLBACK="krewire-web:stable"
            elif STABLE_TAG=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep '^krewire-web:v[0-9]' | sort -V | tail -n 1) && [ -n "$STABLE_TAG" ]; then
              FALLBACK="$STABLE_TAG"
            elif docker inspect --type=image krewire-web:previous >/dev/null 2>&1; then
              FALLBACK="krewire-web:previous"
            else
              echo "⚠ No fallback image found."
              exit 1
            fi
            echo "▶ Fallback target: ${FALLBACK}"
            docker tag "$FALLBACK" krewire-web:latest
            docker rm -f krewire-web 2>/dev/null || true
            docker compose up -d --no-build
            echo "✓ Emergency fallback to stable image (${FALLBACK}) executed successfully."
            echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] ⚠️ SMOKE TEST FAILED: Emergency fallback restored ${FALLBACK}" >> ~/workspace/krewire/deploy.log
          REMOTE
