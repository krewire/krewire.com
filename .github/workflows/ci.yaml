name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test-release-matrix:
    name: Verify Release & Deploy Policy Matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: "1.23"
          cache: true

      - name: Run Release Matrix & Deploy Gate Verification
        run: |
          chmod +x scripts/verify_release_matrix.sh
          ./scripts/verify_release_matrix.sh

      - name: Build and Test Portal
        run: |
          if [ -d "cmd" ]; then
            CGO_ENABLED=0 go test -v ./...
            CGO_ENABLED=0 go build ./...
          fi
